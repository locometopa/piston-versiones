# Crea la release de GitHub automáticamente cada vez que se publica
# una versión nueva (cuando cambia latest.json).
name: Publicar release

on:
  push:
    branches: [main]
    paths: [latest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer latest.json
        id: info
        run: |
          VER=$(jq -r .version latest.json)
          INST=$(jq -r .installer latest.json)
          jq -r .notes latest.json > notas.md
          printf '\n\n---\n**Instalar:** descarga `%s` (abajo, en *Assets*) y ábrelo. No pide permisos de administrador.\n' "$(basename "$INST")" >> notas.md
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "inst=$INST" >> "$GITHUB_OUTPUT"

      - name: Comprobar el instalador
        run: |
          test -f "${{ steps.info.outputs.inst }}"
          echo "$(jq -r .sha256 latest.json)  ${{ steps.info.outputs.inst }}" | sha256sum -c -

      - name: Crear o actualizar la release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.info.outputs.ver }}
          INST: ${{ steps.info.outputs.inst }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release edit "v$VER" --title "Piston $VER" --notes-file notas.md --latest
            gh release upload "v$VER" "$INST" --clobber
          else
            gh release create "v$VER" "$INST" --title "Piston $VER" --notes-file notas.md --latest --target main
          fi
